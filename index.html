<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Hiragana</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;700&family=Noto+Sans+JP:wght@300;400;700&family=Zen+Antique&family=Zen+Kurenaido&family=Hina+Mincho&family=Kosugi+Maru&family=Sawarabi+Gothic&family=M+PLUS+Rounded+1c:wght@300;400&family=Shippori+Mincho:wght@400;700&family=Potta+One&family=RocknRoll+One&family=Reggae+One&family=Rampart+One&family=DotGothic16&family=Yusei+Magic&family=Dela+Gothic+One&family=Stick&family=DM+Mono:wght@300;400;500&display=swap');

  :root {
    --ink: #1a1209;
    --paper: #f5f0e8;
    --accent: #c0392b;
    --muted: #8a7f72;
    --correct: #2e7d32;
    --wrong: #c0392b;
    --card-bg: #fffdf7;
    --border: #d4c9b5;
    --kana-font: 'Noto Serif JP', serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    overscroll-behavior: none;
  }

  /* ---- HEADER ---- */
  header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--ink);
    color: var(--paper);
    padding: 14px 20px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 2px 12px rgba(0,0,0,0.25);
  }

  header h1 {
    font-family: 'Noto Serif JP', serif;
    font-size: 1.25rem;
    font-weight: 400;
    letter-spacing: 0.05em;
  }

  header h1 span {
    color: var(--accent);
    font-weight: 700;
  }

  .header-right {
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .icon-btn {
    background: none;
    border: 1px solid rgba(245,240,232,0.25);
    color: var(--paper);
    padding: 6px 12px;
    border-radius: 4px;
    font-family: 'DM Mono', monospace;
    font-size: 0.7rem;
    cursor: pointer;
    letter-spacing: 0.05em;
    transition: background 0.15s;
  }

  .icon-btn:active { background: rgba(255,255,255,0.1); }

  /* ---- SETTINGS PANEL ---- */
  #settings-panel {
    display: none;
    background: var(--ink);
    color: var(--paper);
    padding: 16px 20px 20px;
    border-bottom: 2px solid var(--accent);
  }

  #settings-panel.open { display: block; }

  #settings-panel h2 {
    font-family: 'Noto Serif JP', serif;
    font-size: 0.8rem;
    font-weight: 300;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* panel section header row */
  .panel-header {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 10px;
  }

  .panel-header h2 { flex: 1; margin: 0; }

  .settings-btn {
    padding: 5px 10px;
    border: 1px solid rgba(245,240,232,0.25);
    background: none;
    color: var(--paper);
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.06em;
    border-radius: 4px;
    cursor: pointer;
    transition: background 0.12s;
  }

  .settings-btn:active { background: rgba(255,255,255,0.1); }
  .settings-btn.danger { border-color: var(--accent); color: var(--accent); }
  .settings-btn.active-btn { border-color: var(--accent); background: rgba(192,57,43,0.2); color: var(--paper); }

  .settings-actions {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .settings-actions .settings-btn { flex: 1; padding: 7px 8px; font-size: 0.64rem; }

  .script-section {
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px solid rgba(245,240,232,0.12);
  }

  .grid-sublabel {
    font-size: 0.58rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(245,240,232,0.35);
    margin-bottom: 6px;
    margin-top: 10px;
  }

  /* ---- ROW-BASED CHAR GRID ---- */
  .char-rows {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .char-row {
    display: flex;
    align-items: center;
    gap: 3px;
  }

  .row-label {
    background: none;
    border: none;
    font-family: 'DM Mono', monospace;
    font-size: 0.52rem;
    letter-spacing: 0.03em;
    color: rgba(245,240,232,0.28);
    min-width: 30px;
    text-align: right;
    cursor: pointer;
    padding: 0 5px 0 0;
    user-select: none;
    transition: color 0.15s;
    flex-shrink: 0;
    line-height: 1;
  }

  .row-label:hover { color: rgba(245,240,232,0.7); }

  .char-toggle {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 5px 3px 4px;
    border: 1px solid rgba(245,240,232,0.18);
    border-radius: 5px;
    cursor: pointer;
    transition: border-color 0.15s, opacity 0.15s;
    background: rgba(255,255,255,0.04);
    user-select: none;
    gap: 2px;
    position: relative;
    flex-shrink: 0;
  }

  .char-toggle.regular { width: 42px; }
  .char-toggle.combo   { width: 50px; }

  .char-toggle.disabled {
    opacity: 0.25;
    background: rgba(0,0,0,0.15);
  }

  .char-toggle .kana {
    font-family: var(--kana-font);
    line-height: 1;
  }

  .char-toggle.regular .kana { font-size: 1.25rem; }
  .char-toggle.combo   .kana { font-size: 1.0rem; }

  .char-toggle .roma {
    font-size: 0.55rem;
    color: rgba(245,240,232,0.45);
    letter-spacing: 0.03em;
  }

  .char-toggle:not(.disabled) { border-color: var(--accent); }

  /* weight overlay */
  .weight-overlay {
    display: none;
    position: absolute;
    bottom: 2px;
    right: 3px;
    font-family: 'DM Mono', monospace;
    font-size: 0.42rem;
    color: rgba(255,255,255,0.85);
    text-shadow: 0 0 3px rgba(0,0,0,0.8);
    pointer-events: none;
    line-height: 1;
  }

  #settings-panel.weights-on .weight-overlay { display: block; }

  /* ---- PRESETS ---- */
  .presets-section {
    padding-bottom: 14px;
    border-bottom: 1px solid rgba(245,240,232,0.12);
  }

  .preset-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    min-height: 24px;
    margin-bottom: 6px;
  }

  .preset-chip {
    display: flex;
    align-items: stretch;
    border: 1px solid rgba(245,240,232,0.22);
    border-radius: 12px;
    overflow: hidden;
    background: rgba(255,255,255,0.05);
  }

  .preset-chip-name {
    padding: 4px 10px 4px 12px;
    font-size: 0.63rem;
    letter-spacing: 0.04em;
    cursor: pointer;
    color: var(--paper);
    background: none;
    border: none;
    font-family: 'DM Mono', monospace;
    transition: color 0.12s;
  }

  .preset-chip-name:hover { color: var(--accent); }

  .preset-chip-del {
    background: none;
    border: none;
    border-left: 1px solid rgba(245,240,232,0.15);
    color: rgba(245,240,232,0.35);
    padding: 4px 9px;
    cursor: pointer;
    font-size: 0.75rem;
    line-height: 1;
    font-family: 'DM Mono', monospace;
    transition: color 0.12s;
  }

  .preset-chip-del:hover { color: var(--accent); }

  .preset-empty {
    font-size: 0.58rem;
    color: rgba(245,240,232,0.25);
    letter-spacing: 0.06em;
    padding: 3px 0;
  }

  .new-preset-form {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 6px;
  }

  .preset-name-inp {
    flex: 1;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(245,240,232,0.22);
    border-radius: 4px;
    color: var(--paper);
    font-family: 'DM Mono', monospace;
    font-size: 0.68rem;
    padding: 5px 8px;
    outline: none;
  }

  .preset-name-inp:focus { border-color: var(--accent); }
  .preset-name-inp::placeholder { color: rgba(245,240,232,0.28); }

  /* ---- SLIDERS (compact) ---- */
  .slider-section {
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid rgba(245,240,232,0.12);
  }

  .slider-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 7px;
  }

  .slider-row label {
    font-size: 0.6rem;
    letter-spacing: 0.04em;
    color: rgba(245,240,232,0.45);
    min-width: 80px;
    flex-shrink: 0;
  }

  .slider-row input[type=range] {
    flex: 1;
    accent-color: var(--accent);
    height: 3px;
    cursor: pointer;
  }

  .slider-val {
    font-size: 0.6rem;
    color: rgba(245,240,232,0.45);
    min-width: 14px;
    text-align: right;
  }

  /* ---- INSTANT MODE TOGGLE ---- */
  .instant-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 0 0;
    margin-top: 14px;
    border-top: 1px solid rgba(245,240,232,0.12);
  }

  .instant-row label {
    font-size: 0.68rem;
    letter-spacing: 0.05em;
    color: var(--muted);
    flex: 1;
  }

  .instant-toggle {
    position: relative;
    width: 36px;
    height: 20px;
    flex-shrink: 0;
  }

  .instant-toggle input { display: none; }

  .instant-slider {
    position: absolute;
    inset: 0;
    background: rgba(245,240,232,0.15);
    border-radius: 20px;
    cursor: pointer;
    transition: background 0.2s;
  }

  .instant-slider::before {
    content: '';
    position: absolute;
    left: 3px; top: 3px;
    width: 14px; height: 14px;
    background: var(--paper);
    border-radius: 50%;
    transition: transform 0.2s;
  }

  .instant-toggle input:checked + .instant-slider { background: var(--accent); }
  .instant-toggle input:checked + .instant-slider::before { transform: translateX(16px); }

  /* ---- FONT SELECTOR ---- */
  .font-selector-row {
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid rgba(245,240,232,0.12);
  }

  .font-selector-row h2 { margin-bottom: 10px; }

  .font-options {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .font-btn {
    padding: 6px 10px 5px;
    border: 1px solid rgba(245,240,232,0.2);
    border-radius: 5px;
    background: rgba(255,255,255,0.04);
    color: var(--paper);
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    transition: border-color 0.15s;
  }

  .font-btn .fb-kana { font-size: 1.2rem; line-height: 1; }
  .font-btn .fb-name { font-family: 'DM Mono', monospace; font-size: 0.5rem; letter-spacing: 0.04em; color: rgba(245,240,232,0.45); white-space: nowrap; }

  .font-btn.active { border-color: var(--accent); background: rgba(192,57,43,0.15); }
  .font-btn.active .fb-name { color: rgba(245,240,232,0.8); }
  .font-btn:active { background: rgba(255,255,255,0.08); }

  /* ---- MODE TABS ---- */
  .mode-tabs {
    display: flex;
    background: var(--ink);
    border-bottom: 2px solid var(--accent);
  }

  .mode-tab {
    flex: 1;
    padding: 10px 12px;
    border: none;
    background: none;
    color: rgba(245,240,232,0.4);
    font-family: 'DM Mono', monospace;
    font-size: 0.68rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    transition: color 0.15s, background 0.15s;
    border-right: 1px solid rgba(245,240,232,0.08);
  }

  .mode-tab:last-child { border-right: none; }
  .mode-tab.active { color: var(--paper); background: rgba(192,57,43,0.25); }
  .mode-tab:active { background: rgba(255,255,255,0.08); }

  /* ---- FLASHCARD REVEAL AREA ---- */
  #reveal-area {
    display: none;
    text-align: center;
    padding: 28px 20px 20px;
    background: var(--ink);
    color: var(--paper);
    border-bottom: 2px solid var(--accent);
    position: sticky;
    top: 57px;
    z-index: 80;
  }

  #reveal-area .fc-prompt {
    font-size: 1.1rem;
    font-family: 'DM Mono', monospace;
    letter-spacing: 0.08em;
    color: rgba(245,240,232,0.6);
    margin-bottom: 6px;
    display: block;
  }

  #reveal-area .fc-romaji {
    font-family: 'DM Mono', monospace;
    font-size: 2.8rem;
    font-weight: 500;
    display: block;
    line-height: 1.1;
    letter-spacing: 0.04em;
    margin-bottom: 16px;
  }

  #reveal-btn {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(245,240,232,0.3);
    color: var(--paper);
    font-family: 'DM Mono', monospace;
    font-size: 0.78rem;
    letter-spacing: 0.08em;
    padding: 10px 28px;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.15s;
    margin-bottom: 4px;
  }

  #reveal-btn:active { background: rgba(255,255,255,0.2); }

  #reveal-answer {
    display: none;
    margin-top: 12px;
  }

  #reveal-answer .fc-kana {
    font-family: var(--kana-font);
    font-size: 4rem;
    line-height: 1;
    display: block;
    margin-bottom: 16px;
  }

  .mark-btns {
    display: flex;
    gap: 10px;
    justify-content: center;
  }

  .mark-btn {
    flex: 1;
    max-width: 140px;
    padding: 12px 0;
    border: none;
    border-radius: 8px;
    font-family: 'DM Mono', monospace;
    font-size: 0.8rem;
    letter-spacing: 0.06em;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
  }

  .mark-btn:active { transform: scale(0.96); }
  .mark-btn.wrong-btn  { background: var(--accent); color: white; }
  .mark-btn.right-btn  { background: #2e7d32; color: white; }

  /* ---- FC HISTORY CARD ---- */
  .fc-card {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    animation: slideIn 0.22s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .fc-card.fc-wrong { border-color: var(--wrong); }
  .fc-card.fc-right { border-color: var(--correct); }

  .fc-card .fc-card-kana {
    font-family: var(--kana-font);
    font-size: 1.8rem;
    flex-shrink: 0;
  }

  .fc-card .fc-card-roma {
    font-size: 0.85rem;
    color: var(--muted);
    flex: 1;
  }

  .fc-card .fc-card-result {
    font-size: 0.65rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: 500;
  }

  .fc-card.fc-wrong .fc-card-result { color: var(--wrong); }
  .fc-card.fc-right .fc-card-result { color: var(--correct); }

  .mode-bar {
    display: flex;
    align-items: center;
    gap: 0;
    padding: 0 14px;
    background: var(--card-bg);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }

  .mode-label {
    font-size: 0.68rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 12px 6px 12px 0;
    flex: 1;
  }

  .combo-wrap {
    display: flex;
    align-items: center;
    gap: 0;
    padding: 8px 10px;
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
  }

  .combo-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--ink);
    width: 26px;
    height: 26px;
    border-radius: 4px;
    font-size: 1rem;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.12s;
    font-family: 'DM Mono', monospace;
  }

  .combo-btn:active { background: var(--border); }

  #combo-display {
    font-size: 0.85rem;
    font-family: 'DM Mono', monospace;
    min-width: 28px;
    text-align: center;
    color: var(--ink);
    font-weight: 500;
  }

  /* Toggle switch */
  .toggle-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 0;
  }

  .toggle-label {
    font-size: 0.68rem;
    letter-spacing: 0.06em;
    color: var(--muted);
  }

  .toggle-label.active { color: var(--ink); font-weight: 500; }

  .switch {
    position: relative;
    width: 44px;
    height: 24px;
    flex-shrink: 0;
  }

  .switch input { display: none; }

  .switch-slider {
    position: absolute;
    inset: 0;
    background: var(--ink);
    border-radius: 24px;
    cursor: pointer;
    transition: background 0.2s;
  }

  .switch-slider::before {
    content: '';
    position: absolute;
    left: 3px;
    top: 3px;
    width: 18px;
    height: 18px;
    background: var(--paper);
    border-radius: 50%;
    transition: transform 0.2s;
  }

  .switch input:checked + .switch-slider { background: var(--accent); }
  .switch input:checked + .switch-slider::before { transform: translateX(20px); }

  /* ---- MAIN FEED ---- */
  #feed {
    padding: 20px 20px 160px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  /* ---- CARD ---- */
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    animation: slideIn 0.25s cubic-bezier(0.22, 1, 0.36, 1);
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .card.correct { border-color: var(--correct); }
  .card.wrong   { border-color: var(--wrong); }

  .card-prompt {
    padding: 28px 20px 20px;
    text-align: center;
  }

  .card-char {
    font-family: var(--kana-font);
    font-size: 4.5rem;
    line-height: 1;
    display: block;
    margin-bottom: 6px;
  }

  .card-roma {
    font-size: 2rem;
    font-family: 'DM Mono', monospace;
    color: var(--ink);
    letter-spacing: 0.05em;
    display: block;
    margin-bottom: 6px;
  }

  .card-sublabel {
    font-size: 0.65rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .card-input-row {
    display: flex;
    border-top: 1px solid var(--border);
  }

  .card-input {
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    padding: 14px 16px;
    font-family: 'Noto Serif JP', serif;
    font-size: 1.4rem;
    color: var(--ink);
    text-align: center;
  }

  .card-input::placeholder { color: var(--muted); font-size: 0.85rem; font-family: 'DM Mono', monospace; }

  .card-submit {
    border: none;
    border-left: 1px solid var(--border);
    background: var(--ink);
    color: var(--paper);
    padding: 14px 20px;
    font-family: 'DM Mono', monospace;
    font-size: 0.75rem;
    letter-spacing: 0.08em;
    cursor: pointer;
    transition: background 0.15s;
  }

  .card-submit:active { background: var(--accent); }

  .card-result {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    border-top: 1px solid var(--border);
    font-size: 0.75rem;
  }

  .result-badge {
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-weight: 500;
    padding: 3px 8px;
    border-radius: 3px;
  }

  .result-badge.correct { background: #e8f5e9; color: var(--correct); }
  .result-badge.wrong   { background: #ffebee; color: var(--wrong); }

  .result-answer {
    color: var(--muted);
    font-size: 0.72rem;
  }

  /* ---- STICKY INPUT ---- */
  #sticky-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--card-bg);
    border-top: 2px solid var(--ink);
    padding: 12px 16px 20px;
    display: flex;
    gap: 10px;
    align-items: center;
    z-index: 50;
  }

  #sticky-input {
    flex: 1;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    font-family: 'Noto Serif JP', serif;
    font-size: 1.3rem;
    background: var(--paper);
    color: var(--ink);
    outline: none;
    text-align: center;
  }

  #sticky-input:focus { border-color: var(--ink); }

  #sticky-input::placeholder {
    font-family: 'DM Mono', monospace;
    font-size: 0.8rem;
    color: var(--muted);
  }

  #sticky-submit {
    background: var(--ink);
    color: var(--paper);
    border: none;
    border-radius: 8px;
    padding: 12px 20px;
    font-family: 'DM Mono', monospace;
    font-size: 0.8rem;
    letter-spacing: 0.05em;
    cursor: pointer;
    transition: background 0.15s;
  }

  #sticky-submit:active { background: var(--accent); }

  /* ---- READER STRIP ---- */
  #active-prompt-banner {
    position: sticky;
    top: 57px;
    z-index: 80;

    min-height: 200px;

    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: opacity 0.15s;
  }

  .slot-char {
    font-family: var(--kana-font);
    line-height: 1;
    text-align: center;
    display: block;
  }

  .reader-slot.slot-current .slot-char { font-size: 10rem; opacity: 1; color: var(--paper); }

  .reader-slot.slot-empty   .slot-char { font-size: 3rem;   opacity: 0.1;  color: var(--paper); }

  .reader-slot.slot-adj.result-correct .slot-char,
  .reader-slot.slot-far.result-correct .slot-char { color: #66bb6a; }
  .reader-slot.slot-adj.result-wrong   .slot-char,
  .reader-slot.slot-far.result-wrong   .slot-char { color: #ef5350; }

  @keyframes wrongPulse {
    0%   { color: var(--paper); transform: scale(1); }
    40%  { color: #ef5350; transform: scale(1.1); }
    100% { color: var(--paper); transform: scale(1); }
  }

  .reader-slot.wrong-flash .slot-char { animation: wrongPulse 0.4s ease; }

  /* ---- WRONG SECTION ---- */
  .section-label {
    font-size: 0.65rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);

    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 6px;

  .clear-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.06em;
    padding: 2px 8px;
    border-radius: 3px;
    cursor: pointer;
  }

  .clear-btn:active { border-color: var(--accent); color: var(--accent); }

  .wrong-count {
    display: inline-block;
    background: var(--wrong);
    color: white;
    font-size: 0.6rem;
    padding: 1px 6px;
    border-radius: 10px;
    margin-left: 6px;
    vertical-align: middle;
  }

  .card.compact {
    display: flex;
    align-items: center;
    padding: 10px 14px;
    gap: 12px;
    border-color: var(--wrong);
    flex-wrap: wrap;
  }

  .card.compact .card-char { font-size: 1.8rem; margin: 0; flex-shrink: 0; }
  .card.compact .card-roma { font-size: 0.95rem; margin: 0; flex-shrink: 0; }

function loadSettings() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const s = JSON.parse(raw);
    if (Array.isArray(s.enabledH) && s.enabledH.length === HIRAGANA.length) enabledH = s.enabledH;

function loadPresets() {

    if (raw) presets = JSON.parse(raw);

}

function buildPresetList() {
  const container = document.getElementById('preset-list');
  container.innerHTML = '';
  if (presets.length === 0) {
    const empty = document.createElement('span');
    empty.className = 'preset-empty';
    empty.textContent = 'no presets — configure chars and click + save';
    container.appendChild(empty);
    return;
  }
  presets.forEach((p, i) => {
    const chip = document.createElement('div');
    chip.className = 'preset-chip';
    const nameBtn = document.createElement('button');
    nameBtn.className = 'preset-chip-name';
    nameBtn.textContent = p.name;
    nameBtn.onclick = () => applyPreset(i);
    const delBtn = document.createElement('button');
    delBtn.className = 'preset-chip-del';
    delBtn.textContent = '×';
    delBtn.onclick = () => deletePreset(i);
    chip.appendChild(nameBtn);
    chip.appendChild(delBtn);
    container.appendChild(chip);
  });
}

  enabledH = [...p.enabledH];
  enabledK = [...p.enabledK];
  buildCharGrid();
  onCharSettingsChange();
  saveSettings();
}

function deletePreset(i) {
  presets.splice(i, 1);
  savePresets();
  buildPresetList();
}

function startNewPreset() {
  document.getElementById('new-preset-form').style.display = 'flex';
  document.getElementById('preset-name-inp').value = '';
  document.getElementById('preset-name-inp').focus();
}

function confirmSavePreset() {
  const name = document.getElementById('preset-name-inp').value.trim();
  if (!name) return;
  presets.push({ name, enabledH: [...enabledH], enabledK: [...enabledK] });
  savePresets();
  buildPresetList();
  document.getElementById('new-preset-form').style.display = 'none';
  document.getElementById('preset-name-inp').value = '';
}

function cancelNewPreset() {
  document.getElementById('new-preset-form').style.display = 'none';
}

// ---- WEIGHT DISPLAY ----
function toggleWeights() {
  showWeights = !showWeights;
  const panel = document.getElementById('settings-panel');
  panel.classList.toggle('weights-on', showWeights);
  document.getElementById('weights-btn').classList.toggle('active-btn', showWeights);
  document.getElementById('weights-btn').textContent = showWeights ? 'hide weights' : 'show weights';
  if (showWeights) {
    updateWeightDisplay();
  } else {
    document.querySelectorAll('.char-toggle[data-char-key]').forEach(el => {
      el.style.background = '';
    });
  }
}

function updateWeightDisplay() {
  const missW    = parseInt(document.getElementById('slider-miss').value);
  const recencyW = parseInt(document.getElementById('slider-recency').value);

  const toggles = document.querySelectorAll('.char-toggle[data-char-key]');
  if (!toggles.length) return;

  const entries = [];
  toggles.forEach(el => {
    const key = el.dataset.charKey;
    const s = stats[key] || { misses: 0, hits: 0, lastSeenTurn: -999 };
    const turnsSince = turnCounter - s.lastSeenTurn;
    let w = 1;
    w += s.misses * missW * 0.4;
    const recencyFactor = Math.min(turnsSince / 5, 4);
    w += recencyFactor * recencyW * 0.2;
    if (turnsSince <= 1) w *= 0.05;
    w = Math.max(w, 0.01);
    entries.push({ el, w });
  });

  const maxW = Math.max(...entries.map(e => e.w));
  const minW = Math.min(...entries.map(e => e.w));
  const range = maxW - minW || 1;

  entries.forEach(({ el, w }) => {
    const norm = (w - minW) / range;
    // cool blue (low) → warm red (high)
    const r = Math.round(norm * 200 + (1 - norm) * 20);
    const g = Math.round(norm * 30  + (1 - norm) * 80);
    const b = Math.round(norm * 20  + (1 - norm) * 180);
    const a = 0.18 + norm * 0.52;
    el.style.background = `rgba(${r},${g},${b},${a})`;
    const ov = el.querySelector('.weight-overlay');
    if (ov) ov.textContent = w.toFixed(1);
  });
}

// ---- INIT ----
function init() {
  loadSettings();
  loadPresets();
  buildCharGrid();
  buildPresetList();
  buildFontSelector();
  applyRandomFont();
  document.getElementById('val-miss').textContent = document.getElementById('slider-miss').value;
  document.getElementById('val-recency').textContent = document.getElementById('slider-recency').value;
  document.getElementById('mode-toggle').checked = !kanaToRoma;
  document.getElementById('instant-toggle').addEventListener('change', saveSettings);
  document.getElementById('preset-name-inp').addEventListener('keydown', e => {
    if (e.key === 'Enter') confirmSavePreset();
    if (e.key === 'Escape') cancelNewPreset();
  });
  updateLabels();
  setMode(appMode);
}

// ---- ALTERNATE ROMAJI ----
const KANA_ALTS = { 'ぢ':['ji','di'], 'ヂ':['ji','di'], 'づ':['zu','du'], 'ヅ':['zu','du'] };

function acceptableFor(combo) {
  if (!kanaToRoma) return [combo.map(c => c.k).join('')];
  let results = [''];
  for (const c of combo) {
    const alts = KANA_ALTS[c.k] || [c.r];
    results = results.flatMap(prefix => alts.map(a => prefix + a));
  }
  return results;
}

// ---- QUEUE HELPERS ----
function pickComboForQueue() {
  const pool = [
    ...HIRAGANA.filter((_, i) => enabledH[i]),
    ...KATAKANA.filter((_, i) => enabledK[i]),
  ];
  if (!pool.length) return null;
  const recentKeys = new Set();
  upcomingQueue.slice(-2).forEach(c => c.forEach(x => recentKeys.add(x.k)));
  if (currentCombo) currentCombo.forEach(x => recentKeys.add(x.k));
  const used = new Set(recentKeys);
  const combo = [];
  for (let slot = 0; slot < comboCount; slot++) {
    const avail = pool.filter(c => !used.has(c.k));
    const pick  = weightedPick(avail.length ? avail : pool);
    combo.push(pick);
    used.add(pick.k);
  }
  return combo;
}

function fillUpcoming() {
  const pool = [
    ...HIRAGANA.filter((_, i) => enabledH[i]),
    ...KATAKANA.filter((_, i) => enabledK[i]),
  ];
  if (!pool.length) return;
  while (upcomingQueue.length < 4) {
    const c = pickComboForQueue();
    if (c) upcomingQueue.push(c); else break;
  }
}

function pushHistory(combo, correct) {
  historyQueue.unshift({ combo, correct });
  if (historyQueue.length > 10) historyQueue.pop();
}

function advanceInstant(correct) {
  pushHistory(currentCombo, correct);
  nextChar();
}

function onCharSettingsChange() {
  const enabledSet = new Set([
    ...HIRAGANA.filter((_, i) => enabledH[i]).map(c => c.k),
    ...KATAKANA.filter((_, i) => enabledK[i]).map(c => c.k),
  ]);
  upcomingQueue = upcomingQueue
    .map(combo => combo.filter(c => enabledSet.has(c.k)))
    .filter(combo => combo.length > 0);
  fillUpcoming();
  if (appMode === 'translate') renderReaderStrip();
}

// ---- WEIGHTED PICK ----
function weightedPick(pool) {
  const missW    = parseInt(document.getElementById('slider-miss').value);
  const recencyW = parseInt(document.getElementById('slider-recency').value);

  const weights = pool.map(c => {
    const s = stats[c.k] || { misses: 0, hits: 0, lastSeenTurn: -999 };
    const turnsSince = turnCounter - s.lastSeenTurn;
    let w = 1;
    w += s.misses * missW * 0.4;
    const recencyFactor = Math.min(turnsSince / 5, 4);
    w += recencyFactor * recencyW * 0.2;
    if (turnsSince <= 1) w *= 0.05;
    return Math.max(w, 0.01);
  });

  const total = weights.reduce((a, b) => a + b, 0);
  let r = Math.random() * total;
  for (let i = 0; i < pool.length; i++) {
    r -= weights[i];
    if (r <= 0) return pool[i];
  }
  return pool[pool.length - 1];
}

// ---- NEXT CHAR ----
function nextChar() {
  fillUpcoming();
  currentCombo = upcomingQueue.length ? upcomingQueue.shift() : [];
  fillUpcoming();

  turnCounter++;
  currentCombo.forEach(c => {
    if (!stats[c.k]) stats[c.k] = { misses: 0, hits: 0, lastSeenTurn: 0 };
    stats[c.k].lastSeenTurn = turnCounter;
  });
  lastComboKeys = currentCombo.map(c => c.k);

  instantDirty = false;
  instantWrong = false;

  applyRandomFont();

  if (appMode === 'translate') {
    renderReaderStrip();
    document.getElementById('sticky-input').value = '';
    setTimeout(() => document.getElementById('sticky-input').focus(), 50);
  } else {
    updateFlashcard();
  }

  if (showWeights) updateWeightDisplay();
}

// ---- RECORD RESULT ----
function recordResult(combo, correct) {
  combo.forEach(c => {
    if (!stats[c.k]) stats[c.k] = { misses: 0, hits: 0, lastSeenTurn: turnCounter };
    if (correct) {
      stats[c.k].hits++;
      stats[c.k].misses = Math.max(0, stats[c.k].misses - 0.5);
    } else {
      stats[c.k].misses++;
    }
  });
}

// ---- MODE SWITCH ----
function setMode(mode) {
  appMode = mode;
  document.getElementById('tab-translate').classList.toggle('active', mode === 'translate');
  document.getElementById('tab-flashcard').classList.toggle('active', mode === 'flashcard');
  document.getElementById('translate-bar').style.display        = mode === 'translate' ? '' : 'none';
  document.getElementById('active-prompt-banner').style.display = mode === 'translate' ? '' : 'none';
  document.getElementById('reveal-area').style.display          = mode === 'flashcard' ? 'block' : 'none';
  document.getElementById('sticky-bar').style.display           = mode === 'translate' ? '' : 'none';
  document.getElementById('wrong-section').style.display        = mode === 'translate' ? (Object.keys(wrongSet).length ? 'block' : 'none') : 'none';
  document.getElementById('history-list').style.display         = mode === 'translate' ? '' : 'none';
  document.getElementById('fc-history-list').style.display      = mode === 'flashcard' ? '' : 'none';
  saveSettings();
  nextChar();
}

// ---- DIRECTION SWITCH ----
function switchDirection() {
  kanaToRoma = !document.getElementById('mode-toggle').checked;
  updateLabels();
  renderReaderStrip();
  document.getElementById('sticky-input').value = '';
  document.getElementById('sticky-input').focus();
  saveSettings();
}

function updateLabels() {
  document.getElementById('label-kana').classList.toggle('active', kanaToRoma);
  document.getElementById('label-roma').classList.toggle('active', !kanaToRoma);
  document.getElementById('sticky-input').placeholder = kanaToRoma ? 'type romaji...' : 'type hiragana...';
}

// ---- CHAR GRID ----
function buildCharGrid() {
  buildGrid('char-rows-h-base',  HIRAGANA, enabledH, KANA_BASE_ROWS,  'h');
  buildGrid('char-rows-h-dak',   HIRAGANA, enabledH, KANA_DAK_ROWS,   'h');
  buildGrid('char-rows-h-combo', HIRAGANA, enabledH, KANA_COMBO_ROWS, 'h');
  buildGrid('char-rows-k-base',  KATAKANA, enabledK, KANA_BASE_ROWS,  'k');
  buildGrid('char-rows-k-dak',   KATAKANA, enabledK, KANA_DAK_ROWS,   'k');
  buildGrid('char-rows-k-combo', KATAKANA, enabledK, KANA_COMBO_ROWS, 'k');
  if (showWeights) updateWeightDisplay();
}

function buildGrid(id, chars, enabledArr, rowDefs, script) {
  const container = document.getElementById(id);
  container.innerHTML = '';
  rowDefs.forEach(({ label, from, to }) => {
    const rowEl = document.createElement('div');
    rowEl.className = 'char-row';

    const lbl = document.createElement('button');
    lbl.className = 'row-label';
    lbl.textContent = label;
    lbl.title = 'toggle row';
    lbl.onclick = () => toggleRow(script, from, to);
    rowEl.appendChild(lbl);

    const isCombo = from >= 71;
    for (let i = from; i < to; i++) {
      const c = chars[i];
      const el = document.createElement('div');
      el.className = `char-toggle ${isCombo ? 'combo' : 'regular'}${enabledArr[i] ? '' : ' disabled'}`;
      el.dataset.charKey = c.k;
      el.innerHTML = `<span class="kana">${c.k}</span><span class="roma">${c.r}</span><span class="weight-overlay"></span>`;
      el.onclick = () => {
        enabledArr[i] = !enabledArr[i];
        el.classList.toggle('disabled');
        onCharSettingsChange();
        saveSettings();
      };
      rowEl.appendChild(el);
    }
    container.appendChild(rowEl);
  });
}

function toggleRow(script, from, to) {
  const arr = script === 'h' ? enabledH : enabledK;
  const allOn = arr.slice(from, to).every(Boolean);
  for (let i = from; i < to; i++) arr[i] = !allOn;
  buildCharGrid();
  onCharSettingsChange();
  saveSettings();
}

function rangeFor(script, group) {
  if (script === 'h') {
    if (group === 'base')  return { arr: enabledH, from: H_BASE[0],  to: H_BASE[1] };
    if (group === 'dak')   return { arr: enabledH, from: H_DAK[0],   to: H_DAK[1] };
    if (group === 'combo') return { arr: enabledH, from: H_COMBO[0], to: H_COMBO[1] };
    if (group === 'all')   return { arr: enabledH, from: 0, to: HIRAGANA.length };
  } else {
    if (group === 'base')  return { arr: enabledK, from: K_BASE[0],  to: K_BASE[1] };
    if (group === 'dak')   return { arr: enabledK, from: K_DAK[0],   to: K_DAK[1] };
    if (group === 'combo') return { arr: enabledK, from: K_COMBO[0], to: K_COMBO[1] };
    if (group === 'all')   return { arr: enabledK, from: 0, to: KATAKANA.length };
  }
}

function setGroup(script, group, state) {
  const scripts = script === 'both' ? ['h','k'] : [script];
  const groups  = group  === 'all'  ? ['base','dak','combo'] : [group];
  scripts.forEach(s => groups.forEach(g => {
    const { arr, from, to } = rangeFor(s, g);
    for (let i = from; i < to; i++) arr[i] = state;
  }));
  buildCharGrid();
  onCharSettingsChange();
  saveSettings();
}

function toggleSettings() {
  document.getElementById('settings-panel').classList.toggle('open');
}

// ---- FONT SELECTOR ----
function buildFontSelector() {
  const container = document.getElementById('font-options');
  container.innerHTML = '';
  let addedDivider = false;
  FONTS.forEach((f, i) => {
    if (f.hard && !addedDivider) {
      const div = document.createElement('div');
      div.style.cssText = 'width:100%;font-size:0.55rem;letter-spacing:0.1em;text-transform:uppercase;color:rgba(245,240,232,0.35);padding:6px 2px 2px;';
      div.textContent = 'stylized / display';
      container.appendChild(div);
      addedDivider = true;
    }
    const btn = document.createElement('button');
    btn.className = 'font-btn' + (selectedFonts.includes(i) ? ' active' : '');
    btn.title = f.name;
    btn.innerHTML = `<span class="fb-kana" style="font-family:${f.stack}">${f.label}</span><span class="fb-name">${f.name}</span>`;
    btn.onclick = () => selectFont(i);
    container.appendChild(btn);
  });
}

function selectFont(idx) {
  if (selectedFonts.includes(idx)) {
    if (selectedFonts.length > 1) selectedFonts = selectedFonts.filter(i => i !== idx);
  } else {
    selectedFonts.push(idx);
  }
  buildFontSelector();
  saveSettings();
}

function applyRandomFont() {
  const idx = selectedFonts[Math.floor(Math.random() * selectedFonts.length)];
  document.documentElement.style.setProperty('--kana-font', FONTS[idx].stack);
}

// ---- READER STRIP ----
function renderReaderStrip() {
  if (appMode !== 'translate') return;
  const strip = document.getElementById('reader-strip');
  strip.innerHTML = '';

  const getText = combo => kanaToRoma
    ? combo.map(c => c.k).join('')
    : combo.map(c => c.r).join(' ');

  function addSlot(combo, typeClass, resultClass) {
    const el = document.createElement('div');
    el.className = ['reader-slot', typeClass, resultClass || ''].filter(Boolean).join(' ');
    const ch = document.createElement('span');
    ch.className = 'slot-char';
    ch.textContent = combo ? getText(combo) : '·';
    el.appendChild(ch);
    strip.appendChild(el);
  }

  const h1 = historyQueue[1], h0 = historyQueue[0];
  addSlot(h1?.combo ?? null, h1 ? 'slot-far' : 'slot-empty', h1 ? (h1.correct ? 'result-correct' : 'result-wrong') : '');
  addSlot(h0?.combo ?? null, h0 ? 'slot-adj' : 'slot-empty', h0 ? (h0.correct ? 'result-correct' : 'result-wrong') : '');
  addSlot(currentCombo.length ? currentCombo : null, currentCombo.length ? 'slot-current' : 'slot-empty');
  addSlot(upcomingQueue[0] ?? null, upcomingQueue[0] ? 'slot-adj' : 'slot-empty');
  addSlot(upcomingQueue[1] ?? null, upcomingQueue[1] ? 'slot-far' : 'slot-empty');
}

// ---- FLASHCARD ----
function updateFlashcard() {
  fcRevealed = false;
  document.getElementById('reveal-answer').style.display = 'none';
  document.getElementById('reveal-btn').style.display = 'inline-block';
  if (!currentCombo.length) { document.getElementById('fc-romaji-display').textContent = '?'; return; }
  document.getElementById('fc-romaji-display').textContent = currentCombo.map(c => c.r).join(' ');
  document.getElementById('fc-kana-display').textContent   = currentCombo.map(c => c.k).join('');
}

function revealAnswer() {
  fcRevealed = true;
  document.getElementById('reveal-btn').style.display    = 'none';
  document.getElementById('reveal-answer').style.display = 'block';
}

function markCard(correct) {
  if (!fcRevealed || !currentCombo.length) return;
  recordResult(currentCombo, correct);
  const romaStr = currentCombo.map(c => c.r).join(' ');
  const kanaStr = currentCombo.map(c => c.k).join('');
  addFcCard(romaStr, kanaStr, correct);
  nextChar();
}

function addFcCard(roma, kana, correct) {
  const list = document.getElementById('fc-history-list');
  const el = document.createElement('div');
  el.className = 'fc-card ' + (correct ? 'fc-right' : 'fc-wrong');
  const kanaSize = kana.length > 3 ? '1.2rem' : '1.8rem';
  el.innerHTML = `
    <span class="fc-card-kana" style="font-size:${kanaSize}">${kana}</span>
    <span class="fc-card-roma">${roma}</span>
    <span class="fc-card-result">${correct ? 'right' : 'wrong'}</span>
  `;
  list.insertBefore(el, list.firstChild);
}

// ---- SUBMIT ----
function submitAnswer() {
  if (!currentCombo.length) return;
  const raw = document.getElementById('sticky-input').value.trim().toLowerCase();
  if (!raw) return;

  const acceptable = acceptableFor(currentCombo);
  const isCorrect  = acceptable.includes(raw);
  recordResult(currentCombo, isCorrect);

  if (!isCorrect) {
    const promptStr = kanaToRoma
      ? currentCombo.map(c => c.k).join('')
      : currentCombo.map(c => c.r).join(' ');
    addToWrong(promptStr, raw, acceptable[0]);
  }

  pushHistory(currentCombo, isCorrect);
  nextChar();
}

// ---- INSTANT MODE ----
document.getElementById('sticky-input').addEventListener('input', () => {
  if (!document.getElementById('instant-toggle').checked) return;
  if (!currentCombo.length || !kanaToRoma) return;

  const raw        = document.getElementById('sticky-input').value.toLowerCase();
  const acceptable = acceptableFor(currentCombo);

  if (raw.length > 0 && !acceptable.some(a => a.startsWith(raw))) instantDirty = true;

  if (!acceptable.includes(raw)) return;

  if (!instantDirty && !instantWrong) {
    recordResult(currentCombo, true);
    advanceInstant(true);
  } else if (!instantWrong) {
    recordResult(currentCombo, false);
    instantWrong = true;
    instantDirty = false;
    const cur = document.querySelector('#reader-strip .slot-current');
    if (cur) {
      cur.classList.add('wrong-flash');
      setTimeout(() => cur.classList.remove('wrong-flash'), 500);
    }
    document.getElementById('sticky-input').value = '';
  } else {
    advanceInstant(false);
  }
});

// ---- WRONG SET ----
function addToWrong(prompt, typed, correct) {
  wrongSet[prompt] = { prompt, typed, correct };
  renderWrongSection();
}

function clearMissed() {
  wrongSet = {};
  renderWrongSection();
}

function renderWrongSection() {
  const section = document.getElementById('wrong-section');
  const list    = document.getElementById('wrong-list');
  const badge   = document.getElementById('wrong-count-badge');
  const entries = Object.values(wrongSet);

  badge.textContent = entries.length;
  if (entries.length === 0) { section.style.display = 'none'; return; }

  section.style.display = 'block';
  list.innerHTML = '';
  entries.forEach(({ prompt, typed, correct }) => {
    const c = document.createElement('div');
    c.className = 'card compact';
    const isKana = kanaToRoma;
    const fontSize = isKana
      ? (prompt.length > 3 ? '1.2rem' : '1.8rem')
      : (prompt.length > 10 ? '0.65rem' : '0.85rem');
    const spanClass = isKana ? 'card-char' : 'card-roma';
    c.innerHTML = `
      <span class="${spanClass}" style="font-size:${fontSize};flex-shrink:0">${prompt}</span>
      <span class="compact-detail">you: <b>${typed}</b><br>correct: <b>${correct}</b></span>
    `;
    list.appendChild(c);
  });
}

// ---- RESET ----
function resetSession() {
  wrongSet = {};
  currentCombo = [];
  lastComboKeys = [];
  turnCounter = 0;
  upcomingQueue = [];
  historyQueue  = [];
  instantDirty  = false;
  instantWrong  = false;
  Object.keys(stats).forEach(k => delete stats[k]);
  enabledH = HIRAGANA.map(() => true);
  enabledK = KATAKANA.map(() => true);
  buildCharGrid();
  document.getElementById('history-list').innerHTML = '';
  document.getElementById('fc-history-list').innerHTML = '';
  renderWrongSection();
  saveSettings();
  nextChar();
  document.getElementById('settings-panel').classList.remove('open');
}

// ---- KEYBOARD ----
document.getElementById('sticky-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') submitAnswer();
});

// ---- GO ----
init();
</script>
