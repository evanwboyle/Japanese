<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Hiragana</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;700&family=Noto+Sans+JP:wght@300;400;700&family=Zen+Antique&family=Zen+Kurenaido&family=Hina+Mincho&family=Kosugi+Maru&family=Sawarabi+Gothic&family=M+PLUS+Rounded+1c:wght@300;400&family=Shippori+Mincho:wght@400;700&family=Klee+One:wght@400;600&family=BIZ+UDGothic:wght@400;700&family=BIZ+UDMincho&family=Kaisei+Opti:wght@400;700&family=Yomogi&family=Potta+One&family=RocknRoll+One&family=Reggae+One&family=Rampart+One&family=DotGothic16&family=Yusei+Magic&family=Dela+Gothic+One&family=Stick&family=DM+Mono:wght@300;400;500&display=swap');

  :root {
    --ink: #1a1209;
    --paper: #f5f0e8;
    --accent: #c0392b;
    --muted: #8a7f72;
    --correct: #2e7d32;
    --wrong: #c0392b;
    --card-bg: #fffdf7;
    --border: #d4c9b5;
    --kana-font: 'Noto Serif JP', serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    overscroll-behavior: none;
  }

  /* ---- HEADER ---- */
  header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--ink);
    color: var(--paper);
    padding: 14px 20px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 2px 12px rgba(0,0,0,0.25);
  }

  header h1 {
    font-family: 'Noto Serif JP', serif;
    font-size: 1.25rem;
    font-weight: 400;
    letter-spacing: 0.05em;
  }

  header h1 span {
    color: var(--accent);
    font-weight: 700;
  }

  .header-right {
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .icon-btn {
    background: none;
    border: 1px solid rgba(245,240,232,0.25);
    color: var(--paper);
    padding: 6px 12px;
    border-radius: 4px;
    font-family: 'DM Mono', monospace;
    font-size: 0.7rem;
    cursor: pointer;
    letter-spacing: 0.05em;
    transition: background 0.15s;
  }

  .icon-btn:active { background: rgba(255,255,255,0.1); }

  /* ---- SETTINGS PANEL ---- */
  #settings-panel {
    background: var(--ink);
    color: var(--paper);
    padding: 16px 20px 120px;
    border-top: 2px solid var(--accent);
    margin-top: 24px;
  }

  #settings-panel h2 {
    font-family: 'Noto Serif JP', serif;
    font-size: 0.8rem;
    font-weight: 300;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* panel section header row */
  .panel-header {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 10px;
  }

  .panel-header h2 { flex: 1; margin: 0; }

  .settings-btn {
    padding: 5px 10px;
    border: 1px solid rgba(245,240,232,0.25);
    background: none;
    color: var(--paper);
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.06em;
    border-radius: 4px;
    cursor: pointer;
    transition: background 0.12s;
  }

  .settings-btn:active { background: rgba(255,255,255,0.1); }
  .settings-btn.danger { border-color: var(--accent); color: var(--accent); }
  .settings-btn.active-btn { border-color: var(--accent); background: rgba(192,57,43,0.2); color: var(--paper); }

  .settings-actions {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .settings-actions .settings-btn { flex: 1; padding: 7px 8px; font-size: 0.64rem; }

  .script-section {
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px solid rgba(245,240,232,0.12);
  }

  .grid-sublabel {
    font-size: 0.58rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(245,240,232,0.35);
    margin-bottom: 6px;
    margin-top: 10px;
  }

  /* ---- ROW-BASED CHAR GRID ---- */
  .char-rows {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .char-row {
    display: flex;
    align-items: center;
    gap: 3px;
  }

  .row-label {
    background: none;
    border: none;
    font-family: 'DM Mono', monospace;
    font-size: 0.52rem;
    letter-spacing: 0.03em;
    color: rgba(245,240,232,0.28);
    min-width: 30px;
    text-align: right;
    cursor: pointer;
    padding: 0 5px 0 0;
    user-select: none;
    transition: color 0.15s;
    flex-shrink: 0;
    line-height: 1;
  }

  .row-label:hover { color: rgba(245,240,232,0.7); }

  .char-toggle {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 5px 3px 4px;
    border: 1px solid rgba(245,240,232,0.18);
    border-radius: 5px;
    cursor: pointer;
    transition: border-color 0.15s, opacity 0.15s;
    background: rgba(255,255,255,0.04);
    user-select: none;
    gap: 2px;
    position: relative;
    flex-shrink: 0;
  }

  .char-toggle.regular { width: 42px; }
  .char-toggle.combo   { width: 50px; }

  .char-toggle.disabled {
    opacity: 0.25;
    background: rgba(0,0,0,0.15);
  }

  .char-toggle .kana {
    font-family: var(--kana-font);
    line-height: 1;
  }

  .char-toggle.regular .kana { font-size: 1.25rem; }
  .char-toggle.combo   .kana { font-size: 1.0rem; }

  .char-toggle .roma {
    font-size: 0.55rem;
    color: rgba(245,240,232,0.45);
    letter-spacing: 0.03em;
  }

  .char-toggle:not(.disabled) { border-color: var(--accent); }

  /* weight overlay */
  .weight-overlay {
    display: none;
    position: absolute;
    bottom: 2px;
    right: 3px;
    font-family: 'DM Mono', monospace;
    font-size: 0.42rem;
    color: rgba(255,255,255,0.85);
    text-shadow: 0 0 3px rgba(0,0,0,0.8);
    pointer-events: none;
    line-height: 1;
  }

  #settings-panel.weights-on .weight-overlay { display: block; }

  /* ---- PRESETS ---- */
  .presets-section {
    padding-bottom: 14px;
    border-bottom: 1px solid rgba(245,240,232,0.12);
  }

  .preset-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    min-height: 24px;
    margin-bottom: 6px;
  }

  .preset-chip {
    display: flex;
    align-items: stretch;
    border: 1px solid rgba(245,240,232,0.22);
    border-radius: 12px;
    overflow: hidden;
    background: rgba(255,255,255,0.05);
  }

  .preset-chip-name {
    padding: 4px 10px 4px 12px;
    font-size: 0.63rem;
    letter-spacing: 0.04em;
    cursor: pointer;
    color: var(--paper);
    background: none;
    border: none;
    font-family: 'DM Mono', monospace;
    transition: color 0.12s;
  }

  .preset-chip-name:hover { color: var(--accent); }

  .preset-chip-del {
    background: none;
    border: none;
    border-left: 1px solid rgba(245,240,232,0.15);
    color: rgba(245,240,232,0.35);
    padding: 4px 9px;
    cursor: pointer;
    font-size: 0.75rem;
    line-height: 1;
    font-family: 'DM Mono', monospace;
    transition: color 0.12s;
  }

  .preset-chip-del:hover { color: var(--accent); }

  .preset-empty {
    font-size: 0.58rem;
    color: rgba(245,240,232,0.25);
    letter-spacing: 0.06em;
    padding: 3px 0;
  }

  .new-preset-form {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 6px;
  }

  .preset-name-inp {
    flex: 1;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(245,240,232,0.22);
    border-radius: 4px;
    color: var(--paper);
    font-family: 'DM Mono', monospace;
    font-size: 0.68rem;
    padding: 5px 8px;
    outline: none;
  }

  .preset-name-inp:focus { border-color: var(--accent); }
  .preset-name-inp::placeholder { color: rgba(245,240,232,0.28); }

  /* ---- SETTINGS TOGGLE ROWS ---- */
  .toggle-section {
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid rgba(245,240,232,0.12);
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .setting-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 0;
  }

  .setting-row label.setting-label {
    font-size: 0.68rem;
    letter-spacing: 0.05em;
    color: rgba(245,240,232,0.65);
    flex: 1;
  }

  /* dark-panel switch (inside settings) */
  .switch-dark {
    position: relative;
    width: 44px;
    height: 24px;
    flex-shrink: 0;
  }

  .switch-dark input { display: none; }

  .switch-dark-slider {
    position: absolute;
    inset: 0;
    background: rgba(245,240,232,0.15);
    border-radius: 24px;
    cursor: pointer;
    transition: background 0.2s;
  }

  .switch-dark-slider::before {
    content: '';
    position: absolute;
    left: 3px; top: 3px;
    width: 18px; height: 18px;
    background: var(--paper);
    border-radius: 50%;
    transition: transform 0.2s;
  }

  .switch-dark input:checked + .switch-dark-slider { background: var(--accent); }
  .switch-dark input:checked + .switch-dark-slider::before { transform: translateX(20px); }

  /* ---- FONT SELECTOR ---- */
  .font-selector-row {
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid rgba(245,240,232,0.12);
  }

  .font-selector-row h2 { margin-bottom: 10px; }

  .settings-version {
    margin-top: 18px;
    margin-bottom: 8px;
    font-size: 0.7rem;
    color: rgba(245,240,232,0.3);
    letter-spacing: 0.04em;
    text-align: right;
  }

  .font-options {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .font-btn {
    padding: 6px 10px 5px;
    border: 1px solid rgba(245,240,232,0.2);
    border-radius: 5px;
    background: rgba(255,255,255,0.04);
    color: var(--paper);
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    transition: border-color 0.15s;
  }

  .font-btn .fb-kana { font-size: 1.2rem; line-height: 1; }
  .font-btn .fb-name { font-family: 'DM Mono', monospace; font-size: 0.5rem; letter-spacing: 0.04em; color: rgba(245,240,232,0.45); white-space: nowrap; }

  .font-btn.active { border-color: var(--accent); background: rgba(192,57,43,0.15); }
  .font-btn.active .fb-name { color: rgba(245,240,232,0.8); }
  .font-btn:active { background: rgba(255,255,255,0.08); }

  /* ---- MODE TABS ---- */
  .mode-tabs {
    display: flex;
    background: var(--ink);
    border-bottom: 2px solid var(--accent);
  }

  .mode-tab {
    flex: 1;
    padding: 10px 12px;
    border: none;
    background: none;
    color: rgba(245,240,232,0.4);
    font-family: 'DM Mono', monospace;
    font-size: 0.68rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    transition: color 0.15s, background 0.15s;
    border-right: 1px solid rgba(245,240,232,0.08);
  }

  .mode-tab:last-child { border-right: none; }
  .mode-tab.active { color: var(--paper); background: rgba(192,57,43,0.25); }
  .mode-tab:active { background: rgba(255,255,255,0.08); }

  /* ---- FLASHCARD REVEAL AREA ---- */
  #reveal-area {
    display: none;
    text-align: center;
    padding: 28px 20px 20px;
    background: var(--ink);
    color: var(--paper);
    border-bottom: 2px solid var(--accent);
    position: sticky;
    top: 57px;
    z-index: 80;
  }

  #reveal-area .fc-prompt {
    font-size: 1.1rem;
    font-family: 'DM Mono', monospace;
    letter-spacing: 0.08em;
    color: rgba(245,240,232,0.6);
    margin-bottom: 6px;
    display: block;
  }

  #reveal-area .fc-romaji {
    font-family: 'DM Mono', monospace;
    font-size: 2.8rem;
    font-weight: 500;
    display: block;
    line-height: 1.1;
    letter-spacing: 0.04em;
    margin-bottom: 16px;
  }

  #reveal-btn {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(245,240,232,0.3);
    color: var(--paper);
    font-family: 'DM Mono', monospace;
    font-size: 0.78rem;
    letter-spacing: 0.08em;
    padding: 10px 28px;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.15s;
    margin-bottom: 4px;
  }

  #reveal-btn:active { background: rgba(255,255,255,0.2); }

  #reveal-answer {
    display: none;
    margin-top: 12px;
  }

  #reveal-answer .fc-kana {
    font-family: var(--kana-font);
    font-size: 4rem;
    line-height: 1;
    display: block;
    margin-bottom: 16px;
  }

  .mark-btns {
    display: flex;
    gap: 10px;
    justify-content: center;
  }

  .mark-btn {
    flex: 1;
    max-width: 140px;
    padding: 12px 0;
    border: none;
    border-radius: 8px;
    font-family: 'DM Mono', monospace;
    font-size: 0.8rem;
    letter-spacing: 0.06em;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
  }

  .mark-btn:active { transform: scale(0.96); }
  .mark-btn.wrong-btn  { background: var(--accent); color: white; }
  .mark-btn.right-btn  { background: #2e7d32; color: white; }

  /* ---- FC HISTORY CARD ---- */
  .fc-card {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    animation: slideIn 0.22s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .fc-card.fc-wrong { border-color: var(--wrong); }
  .fc-card.fc-right { border-color: var(--correct); }

  .fc-card .fc-card-kana {
    font-family: var(--kana-font);
    font-size: 1.8rem;
    flex-shrink: 0;
  }

  .fc-card .fc-card-roma {
    font-size: 0.85rem;
    color: var(--muted);
    flex: 1;
  }

  .fc-card .fc-card-result {
    font-size: 0.65rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: 500;
  }

  .fc-card.fc-wrong .fc-card-result { color: var(--wrong); }
  .fc-card.fc-right .fc-card-result { color: var(--correct); }

  .mode-bar {
    display: flex;
    align-items: center;
    gap: 0;
    padding: 0 14px;
    background: var(--card-bg);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }

  .mode-label {
    font-size: 0.68rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 12px 6px 12px 0;
    flex: 1;
  }

  .combo-wrap {
    display: flex;
    align-items: center;
    gap: 0;
    padding: 8px 10px;
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
  }

  .combo-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--ink);
    width: 26px;
    height: 26px;
    border-radius: 4px;
    font-size: 1rem;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.12s;
    font-family: 'DM Mono', monospace;
  }

  .combo-btn:active { background: var(--border); }

  #combo-display {
    font-size: 0.85rem;
    font-family: 'DM Mono', monospace;
    min-width: 28px;
    text-align: center;
    color: var(--ink);
    font-weight: 500;
  }

  /* Toggle switch */
  .toggle-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 0;
  }

  .toggle-label {
    font-size: 0.68rem;
    letter-spacing: 0.06em;
    color: var(--muted);
  }

  .toggle-label.active { color: var(--ink); font-weight: 500; }

  .switch {
    position: relative;
    width: 44px;
    height: 24px;
    flex-shrink: 0;
  }

  .switch input { display: none; }

  .switch-slider {
    position: absolute;
    inset: 0;
    background: var(--ink);
    border-radius: 24px;
    cursor: pointer;
    transition: background 0.2s;
  }

  .switch-slider::before {
    content: '';
    position: absolute;
    left: 3px;
    top: 3px;
    width: 18px;
    height: 18px;
    background: var(--paper);
    border-radius: 50%;
    transition: transform 0.2s;
  }

  .switch input:checked + .switch-slider { background: var(--accent); }
  .switch input:checked + .switch-slider::before { transform: translateX(20px); }

  /* ---- CHAR SECTION 2-COL ---- */
  .char-section-cols {
    display: flex;
    gap: 14px;
    align-items: flex-start;
    flex-wrap: wrap;
  }
  .char-col { flex: 1; min-width: 160px; }

  /* clickable sublabel */
  .grid-sublabel.clickable {
    cursor: pointer;
    user-select: none;
    transition: color 0.12s;
  }
  .grid-sublabel.clickable:hover { color: rgba(245,240,232,0.65); }
  .grid-sublabel.clickable::after { content: ' ↕'; opacity: 0.4; font-size: 0.5rem; }

  /* ---- TIMER ---- */
  #char-timer {
    position: absolute;
    top: 8px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'DM Mono', monospace;
    font-size: 0.85rem;
    color: var(--paper);
    opacity: 0.8;
    letter-spacing: 0.06em;
    pointer-events: none;
    display: none;
  }
  #char-timer.visible { display: block; }

  /* ---- ACCURACY ---- */
  #accuracy-display {
    position: absolute;
    top: 8px;
    right: 16px;
    font-family: 'DM Mono', monospace;
    font-size: 0.75rem;
    color: var(--paper);
    opacity: 0.7;
    letter-spacing: 0.04em;
    pointer-events: none;
  }

  /* ---- HISTORY GRID ---- */
  .history-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
    gap: 6px;
  }

  .hist-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 4px 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    position: relative;
    cursor: default;
    transition: border-color 0.15s;
  }

  .hist-card.has-wrong { border-color: var(--wrong); }

  .hist-card.is-newest {
    border-color: var(--ink);
    animation: slideIn 0.22s cubic-bezier(0.22,1,0.36,1);
  }

  .hist-card.has-wrong.is-newest { border-color: var(--wrong); }

  .hist-kana {
    font-family: var(--kana-font);
    line-height: 1;
    color: var(--ink);
  }

  .hist-roma {
    font-size: 0.5rem;
    color: var(--muted);
    letter-spacing: 0.02em;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
  }

  .hist-wrong-badge {
    position: absolute;
    top: -6px;
    right: -6px;
    background: var(--wrong);
    color: white;
    font-family: 'DM Mono', monospace;
    font-size: 0.72rem;
    font-weight: 500;
    min-width: 20px;
    height: 20px;
    padding: 0 4px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .history-empty {
    grid-column: 1 / -1;
    text-align: center;
    padding: 20px;
    color: var(--muted);
    font-size: 0.72rem;
    letter-spacing: 0.08em;
  }

  /* ---- MAIN FEED ---- */
  #feed {
    padding: 20px 20px 160px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  /* ---- CARD ---- */
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    animation: slideIn 0.25s cubic-bezier(0.22, 1, 0.36, 1);
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .card.correct { border-color: var(--correct); }
  .card.wrong   { border-color: var(--wrong); }

  .card-prompt {
    padding: 28px 20px 20px;
    text-align: center;
  }

  .card-char {
    font-family: var(--kana-font);
    font-size: 4.5rem;
    line-height: 1;
    display: block;
    margin-bottom: 6px;
  }

  .card-roma {
    font-size: 2rem;
    font-family: 'DM Mono', monospace;
    color: var(--ink);
    letter-spacing: 0.05em;
    display: block;
    margin-bottom: 6px;
  }

  .card-sublabel {
    font-size: 0.65rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .card-input-row {
    display: flex;
    border-top: 1px solid var(--border);
  }

  { label: 'pa', from: 66, to: 71 },

const KANA_COMBO_ROWS = [
  { label: 'kya', from: 71,  to: 74  },
  { label: 'gya', from: 74,  to: 77  },
  { label: 'sha', from: 77,  to: 80  },
  { label: 'ja',  from: 80,  to: 83  },
  { label: 'cha', from: 83,  to: 86  },
  { label: 'nya', from: 86,  to: 89  },
  { label: 'hya', from: 89,  to: 92  },
  { label: 'bya', from: 92,  to: 95  },
  { label: 'pya', from: 95,  to: 98  },
  { label: 'mya', from: 98,  to: 101 },
  { label: 'rya', from: 101, to: 104 },
];

// ---- INDEX RANGES ----
const H_BASE  = [0,  46];
const H_DAK   = [46, 71];
const H_COMBO = [71, HIRAGANA.length];
const K_BASE  = [0,  46];
const K_DAK   = [46, 71];
const K_COMBO = [71, KATAKANA.length];

// ---- STATE ----
let enabledH = HIRAGANA.map(() => true);
let enabledK = KATAKANA.map(() => true);
let appMode = 'translate';
let kanaToRoma = true;
let currentCombo = [];
let comboCount = 1;
let wrongSet = {};
let selectedFonts = [0];
let fcRevealed = false;
let showWeights = false;

// Queue / instant-mode state
let upcomingQueue = [];
let historyQueue  = [];
let instantDirty  = false;
let instantWrong  = false;
let instantSilentDirty = false; // backspace was pressed — no flash, but still counts as an error

const stats = {};         // { [kana]: { halfLife, lastSeenTurn } }
const charHistory = {};   // { [kana]: { wrongCount, rightCount, lastSeenTurn, kana, roma } }
let turnCounter = 0;
let lastComboKeys = [];
let charStartTime = null;
let weightedEnabled = true;
let showCorrect     = false;
let timerEnabled    = true;
let timerRafId      = null;
const recentResults = []; // last 20 correct/wrong booleans for accuracy
const globalTimings = []; // clamped seconds, rolling window
const TIMINGS_WINDOW  = 200;
const TIMINGS_WARMUP  = 10;  // fall back to hard thresholds below this

// presets: [{name, enabledH, enabledK}]
let presets = [];

// ---- PERSISTENCE ----
const STORAGE_KEY = 'kana-practice-v1';
const PRESETS_KEY = 'kana-presets-v1';

function saveSettings() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      enabledH,
      enabledK,
      selectedFonts,
      instantMode: document.getElementById('instant-toggle').checked,
      weightedEnabled,
      showCorrect,
      timerEnabled,
      appMode,
      kanaToRoma,
    }));
  } catch(e) {}
}

function loadSettings() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const s = JSON.parse(raw);
    if (Array.isArray(s.enabledH) && s.enabledH.length === HIRAGANA.length) enabledH = s.enabledH;
    if (Array.isArray(s.enabledK) && s.enabledK.length === KATAKANA.length) enabledK = s.enabledK;
    if (Array.isArray(s.selectedFonts) && s.selectedFonts.length) selectedFonts = s.selectedFonts;
    else if (typeof s.fontIdx === 'number') selectedFonts = [s.fontIdx]; // migrate old format
    if (s.instantMode !== undefined) document.getElementById('instant-toggle').checked = s.instantMode;
    if (typeof s.weightedEnabled === 'boolean') {
      weightedEnabled = s.weightedEnabled;
      document.getElementById('weighted-toggle').checked = weightedEnabled;
    }
    if (typeof s.showCorrect === 'boolean') {
      showCorrect = s.showCorrect;
      document.getElementById('show-correct-toggle').checked = showCorrect;
    }
    if (typeof s.timerEnabled === 'boolean') {
      timerEnabled = s.timerEnabled;
      document.getElementById('timer-toggle').checked = timerEnabled;
    }
    if (s.appMode === 'translate' || s.appMode === 'flashcard') appMode = s.appMode;
    if (typeof s.kanaToRoma === 'boolean') kanaToRoma = s.kanaToRoma;
  } catch(e) {}
}

function savePresets() {
  try { localStorage.setItem(PRESETS_KEY, JSON.stringify(presets)); } catch(e) {}
}

function loadPresets() {
  try {
    const raw = localStorage.getItem(PRESETS_KEY);
    if (raw) presets = JSON.parse(raw);
  } catch(e) {}
}

// ---- PRESET UI ----
function buildPresetList() {
  const container = document.getElementById('preset-list');
  container.innerHTML = '';
  if (presets.length === 0) {
    const empty = document.createElement('span');
    empty.className = 'preset-empty';
    empty.textContent = 'no presets — configure chars and click + save';
    container.appendChild(empty);
    return;
  }
  presets.forEach((p, i) => {
    const chip = document.createElement('div');

    delBtn.className = 'preset-chip-del';

    delBtn.onclick = () => deletePreset(i);
    chip.appendChild(nameBtn);
    chip.appendChild(delBtn);

function applyPreset(i) {
  const p = presets[i];

  enabledK = [...p.enabledK];

function deletePreset(i) {

}

}

function confirmSavePreset() {

  presets.push({ name, enabledH: [...enabledH], enabledK: [...enabledK] });

}

function onShowCorrectToggle() {

}

function toggleGroup(script, group) {

  const allOn = arr.slice(from, to).every(Boolean);
  for (let i = from; i < to; i++) arr[i] = !allOn;

// ---- TIMER ----
function onTimerToggle() {
  timerEnabled = document.getElementById('timer-toggle').checked;
  const el = document.getElementById('char-timer');
  if (!timerEnabled) {
    el.classList.remove('visible');
    if (timerRafId) { cancelAnimationFrame(timerRafId); timerRafId = null; }
  } else {
    el.classList.add('visible');
    startTimer();
  }
  saveSettings();
}

function startTimer() {
  if (timerRafId) cancelAnimationFrame(timerRafId);
  if (!timerEnabled) return;
  const el = document.getElementById('char-timer');
  el.classList.add('visible');
  function tick() {
    if (!charStartTime) { timerRafId = requestAnimationFrame(tick); return; }
    const s = (Date.now() - charStartTime) / 1000;
    el.textContent = s.toFixed(1) + 's';
    timerRafId = requestAnimationFrame(tick);
  }
  timerRafId = requestAnimationFrame(tick);
}

function stopTimer() {
  if (timerRafId) { cancelAnimationFrame(timerRafId); timerRafId = null; }
}

// ---- ACCURACY ----
function trackResult(correct) {
  recentResults.push(correct);
  if (recentResults.length > 20) recentResults.shift();
  updateAccuracy();
}

function updateAccuracy() {
  const el = document.getElementById('accuracy-display');
  if (!el || recentResults.length === 0) return;
  const pct = Math.round(recentResults.filter(Boolean).length / recentResults.length * 100);
  el.textContent = pct + '%';
}

// ---- LAST UPDATED ----
function setLastUpdated() {
  const el = document.getElementById('last-updated');
  if (!el) return;
  const d = new Date(document.lastModified);
  // Fall back to now if lastModified is unreliable (returns epoch or current time)
  const ref = d.getFullYear() > 2000 ? d : new Date();
  const jst = ref.toLocaleString('ja-JP', {
    timeZone: 'Asia/Tokyo',
    year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit',
  });
  el.textContent = 'last updated: ' + jst.replace(/\//g, '-');
}

function toggleWeights() {
  showWeights = !showWeights;
  const panel = document.getElementById('settings-panel');
  panel.classList.toggle('weights-on', showWeights);
  document.getElementById('weights-btn').classList.toggle('active-btn', showWeights);
  document.getElementById('weights-btn').textContent = showWeights ? 'hide weights' : 'show weights';
  if (showWeights) {
    updateWeightDisplay();
  } else {
    document.querySelectorAll('.char-toggle[data-char-key]').forEach(el => {
      el.style.background = '';
    });
  }
}

function updateWeightDisplay() {
  const toggles = document.querySelectorAll('.char-toggle[data-char-key]');
  if (!toggles.length) return;

  const entries = [];
  toggles.forEach(el => {
    const key = el.dataset.charKey;
    const s = stats[key] || { halfLife: 1, lastSeenTurn: -999 };
    const turnsSince = Math.max(0, turnCounter - s.lastSeenTurn);
    const p = Math.pow(2, -turnsSince / s.halfLife);
    const w = Math.max(1 - p, 0.01);
    entries.push({ el, w });
  });

  const maxW = Math.max(...entries.map(e => e.w));
  const minW = Math.min(...entries.map(e => e.w));
  const range = maxW - minW || 1;

  entries.forEach(({ el, w }) => {
    const norm = (w - minW) / range;
    // cool blue (low) → warm red (high)
    const r = Math.round(norm * 200 + (1 - norm) * 20);
    const g = Math.round(norm * 30  + (1 - norm) * 80);
    const b = Math.round(norm * 20  + (1 - norm) * 180);
    const a = 0.18 + norm * 0.52;
    el.style.background = `rgba(${r},${g},${b},${a})`;
    const ov = el.querySelector('.weight-overlay');
    if (ov) ov.textContent = w.toFixed(1);
  });
}

// ---- INIT ----
function init() {
  loadSettings();
  loadPresets();
  buildCharGrid();
  buildPresetList();

// ---- ALTERNATE ROMAJI ----
const KANA_ALTS = { 'ぢ':['ji','di'], 'ヂ':['ji','di'], 'づ':['zu','du'], 'ヅ':['zu','du'] };

function acceptableFor(combo) {
  if (!kanaToRoma) return [combo.map(c => c.k).join('')];
  let results = [''];
  for (const c of combo) {
    const alts = KANA_ALTS[c.k] || [c.r];
    results = results.flatMap(prefix => alts.map(a => prefix + a));
  }
  return results;
}

// ---- QUEUE HELPERS ----
function pickComboForQueue() {
  const pool = [
    ...HIRAGANA.filter((_, i) => enabledH[i]),
    ...KATAKANA.filter((_, i) => enabledK[i]),
  ];
  if (!pool.length) return null;
  const recentKeys = new Set();
  upcomingQueue.slice(-2).forEach(c => c.forEach(x => recentKeys.add(x.k)));
  if (currentCombo) currentCombo.forEach(x => recentKeys.add(x.k));
  const used = new Set(recentKeys);
  const combo = [];
  for (let slot = 0; slot < comboCount; slot++) {
    const avail = pool.filter(c => !used.has(c.k));
    const pick  = weightedPick(avail.length ? avail : pool);
    combo.push(pick);
    used.add(pick.k);
  }
  return combo;
}

function fillUpcoming() {
  const pool = [
    ...HIRAGANA.filter((_, i) => enabledH[i]),
    ...KATAKANA.filter((_, i) => enabledK[i]),
  ];
  if (!pool.length) return;
  while (upcomingQueue.length < 4) {
    const c = pickComboForQueue();
    if (c) upcomingQueue.push(c); else break;
  }
}

function pushHistory(combo, correct) {
  historyQueue.unshift({ combo, correct });
  if (historyQueue.length > 10) historyQueue.pop();
}

// concludeRound: single exit point for every translate-mode round.
// verdict: 'right' (clean, no errors) | 'wrong' (any error — flash, backspace, or wrong submit)
function concludeRound(verdict) {
  const correct = verdict === 'right';
  trackResult(correct);
  updateCharHistory(currentCombo, correct);
  pushHistory(currentCombo, correct);
  nextChar();
}

function onCharSettingsChange() {
  const enabledSet = new Set([
    ...HIRAGANA.filter((_, i) => enabledH[i]).map(c => c.k),
    ...KATAKANA.filter((_, i) => enabledK[i]).map(c => c.k),
  ]);
  upcomingQueue = upcomingQueue
    .map(combo => combo.filter(c => enabledSet.has(c.k)))
    .filter(combo => combo.length > 0);
  fillUpcoming();
  if (appMode === 'translate') renderReaderStrip();
}

// ---- TIMING / QUALITY SCORE ----
function recordTiming(t) {
  globalTimings.push(t);
  if (globalTimings.length > TIMINGS_WINDOW) globalTimings.shift();
}

function timeToQ(t_seconds) {
  // cold start: hard thresholds until we have enough data
  if (globalTimings.length < TIMINGS_WARMUP) {
    if (t_seconds < 2)  return 1.0;
    if (t_seconds < 4)  return 0.8;
    if (t_seconds < 7)  return 0.4;
    return 0.0;
  }
  // compute percentile of t against global timing distribution
  const n = globalTimings.length;
  const slower = globalTimings.filter(x => x <= t_seconds).length;
  const percentile = (slower / n) * 100;  // 0 = fastest, 100 = slowest
  // sigmoid: 50th pct → 0.8, 90th pct → ~0.1, 0th pct → ~1.0
  const q = 1 / (1 + Math.exp(0.09 * (percentile - 65)));
  return q;
}

// ---- WEIGHTED PICK (Half-Life Regression) ----
function weightedPick(pool) {
  if (!weightedEnabled) return pool[Math.floor(Math.random() * pool.length)];

  const weights = pool.map(c => {
    const s = stats[c.k] || { halfLife: 1, lastSeenTurn: -999 };
    const turnsSince = Math.max(0, turnCounter - s.lastSeenTurn);
    // recall probability: p = 2^(-turnsSince / halfLife)
    const p = Math.pow(2, -turnsSince / s.halfLife);
    // weight = inverse recall — lower recall → higher priority
    return Math.max(1 - p, 0.01);
  });

  const total = weights.reduce((a, b) => a + b, 0);
  let r = Math.random() * total;
  for (let i = 0; i < pool.length; i++) {
    r -= weights[i];
    if (r <= 0) return pool[i];
  }
  return pool[pool.length - 1];
}

// ---- NEXT CHAR ----
function nextChar() {
  fillUpcoming();
  currentCombo = upcomingQueue.length ? upcomingQueue.shift() : [];
  fillUpcoming();

  turnCounter++;
  charStartTime = Date.now();
  startTimer();
  currentCombo.forEach(c => {
    if (!stats[c.k]) stats[c.k] = { halfLife: 1, lastSeenTurn: 0 };
    stats[c.k].lastSeenTurn = turnCounter;
  });
  lastComboKeys = currentCombo.map(c => c.k);

  instantDirty       = false;
  instantWrong       = false;
  instantSilentDirty = false;

  applyRandomFont();

  if (appMode === 'translate') {
    renderReaderStrip();
    document.getElementById('sticky-input').value = '';
    setTimeout(() => document.getElementById('sticky-input').focus(), 50);
  } else {
    updateFlashcard();
  }

  if (showWeights) updateWeightDisplay();
}

// ---- RECORD RESULT ----
function recordResult(combo, correct) {
  // compute graded quality score from response time
  let q = 0;
  if (correct && charStartTime !== null) {
    const raw = (Date.now() - charStartTime) / 1000;
    const t   = Math.max(0.5, Math.min(10, raw));
    recordTiming(t);
    q = timeToQ(t);
    if (q < 0.15) q = 0; // near-fail → treat as wrong
  }

  combo.forEach(c => {
    if (!stats[c.k]) stats[c.k] = { halfLife: 1, lastSeenTurn: turnCounter };
    const s = stats[c.k];
    if (q > 0) {
      // correct: grow half-life proportional to quality
      s.halfLife = s.halfLife * (1 + q);
    } else {
      // wrong or too slow: shrink half-life, floor at 0.5
      s.halfLife = Math.max(0.5, s.halfLife * 0.5);
    }
  });
}

// ---- MODE SWITCH ----
function setMode(mode) {
  appMode = mode;
  document.getElementById('tab-translate').classList.toggle('active', mode === 'translate');
  document.getElementById('tab-flashcard').classList.toggle('active', mode === 'flashcard');
  document.getElementById('translate-bar').style.display        = mode === 'translate' ? '' : 'none';
  document.getElementById('active-prompt-banner').style.display = mode === 'translate' ? '' : 'none';
  document.getElementById('reveal-area').style.display          = mode === 'flashcard' ? 'block' : 'none';
  document.getElementById('sticky-bar').style.display           = mode === 'translate' ? '' : 'none';
  document.getElementById('wrong-section').style.display        = mode === 'translate' ? (Object.keys(wrongSet).length ? 'block' : 'none') : 'none';
  saveSettings();
  nextChar();
}

function switchDirection() {

  updateLabels();
  renderReaderStrip();
  document.getElementById('sticky-input').value = '';
  document.getElementById('sticky-input').focus();

// ---- CHAR GRID ----
function buildCharGrid() {
  buildGrid('char-rows-h-base',  HIRAGANA, enabledH, KANA_BASE_ROWS,  'h');
  buildGrid('char-rows-h-dak',   HIRAGANA, enabledH, KANA_DAK_ROWS,   'h');
  buildGrid('char-rows-h-combo', HIRAGANA, enabledH, KANA_COMBO_ROWS, 'h');
  buildGrid('char-rows-k-base',  KATAKANA, enabledK, KANA_BASE_ROWS,  'k');
  buildGrid('char-rows-k-dak',   KATAKANA, enabledK, KANA_DAK_ROWS,   'k');
  buildGrid('char-rows-k-combo', KATAKANA, enabledK, KANA_COMBO_ROWS, 'k');
  if (showWeights) updateWeightDisplay();
}

function buildGrid(id, chars, enabledArr, rowDefs, script) {
  const container = document.getElementById(id);
  container.innerHTML = '';
  rowDefs.forEach(({ label, from, to }) => {
    const rowEl = document.createElement('div');
    rowEl.className = 'char-row';

    const lbl = document.createElement('button');
    lbl.className = 'row-label';
    lbl.textContent = label;
    lbl.title = 'toggle row';
    lbl.onclick = () => toggleRow(script, from, to);
    rowEl.appendChild(lbl);

    const isCombo = from >= 71;
    for (let i = from; i < to; i++) {
      const c = chars[i];
      const el = document.createElement('div');
      el.className = `char-toggle ${isCombo ? 'combo' : 'regular'}${enabledArr[i] ? '' : ' disabled'}`;
      el.dataset.charKey = c.k;
      el.innerHTML = `<span class="kana">${c.k}</span><span class="roma">${c.r}</span><span class="weight-overlay"></span>`;
      el.onclick = () => {
        enabledArr[i] = !enabledArr[i];
        el.classList.toggle('disabled');
        onCharSettingsChange();
        saveSettings();
      };
      rowEl.appendChild(el);
    }
    container.appendChild(rowEl);
  });
}

function toggleRow(script, from, to) {
  const arr = script === 'h' ? enabledH : enabledK;
  const allOn = arr.slice(from, to).every(Boolean);
  for (let i = from; i < to; i++) arr[i] = !allOn;
  buildCharGrid();
  onCharSettingsChange();
  saveSettings();
}

function rangeFor(script, group) {
  if (script === 'h') {
    if (group === 'base')  return { arr: enabledH, from: H_BASE[0],  to: H_BASE[1] };
    if (group === 'dak')   return { arr: enabledH, from: H_DAK[0],   to: H_DAK[1] };
    if (group === 'combo') return { arr: enabledH, from: H_COMBO[0], to: H_COMBO[1] };
    if (group === 'all')   return { arr: enabledH, from: 0, to: HIRAGANA.length };
  } else {
    if (group === 'base')  return { arr: enabledK, from: K_BASE[0],  to: K_BASE[1] };
    if (group === 'dak')   return { arr: enabledK, from: K_DAK[0],   to: K_DAK[1] };
    if (group === 'combo') return { arr: enabledK, from: K_COMBO[0], to: K_COMBO[1] };
    if (group === 'all')   return { arr: enabledK, from: 0, to: KATAKANA.length };
  }
}

function setGroup(script, group, state) {
  const scripts = script === 'both' ? ['h','k'] : [script];
  const groups  = group  === 'all'  ? ['base','dak','combo'] : [group];
  scripts.forEach(s => groups.forEach(g => {
    const { arr, from, to } = rangeFor(s, g);
    for (let i = from; i < to; i++) arr[i] = state;
  }));
  buildCharGrid();
  onCharSettingsChange();
  saveSettings();
}


// ---- FONT SELECTOR ----
function buildFontSelector() {
  const container = document.getElementById('font-options');
  container.innerHTML = '';
  let addedDivider = false;
  FONTS.forEach((f, i) => {
    if (f.hard && !addedDivider) {
      const div = document.createElement('div');
      div.style.cssText = 'width:100%;font-size:0.55rem;letter-spacing:0.1em;text-transform:uppercase;color:rgba(245,240,232,0.35);padding:6px 2px 2px;';
      div.textContent = 'stylized / display';
      container.appendChild(div);
      addedDivider = true;
    }
    const btn = document.createElement('button');
    btn.className = 'font-btn' + (selectedFonts.includes(i) ? ' active' : '');
    btn.title = f.name;
    btn.innerHTML = `<span class="fb-kana" style="font-family:${f.stack}">${f.label}</span><span class="fb-name">${f.name}</span>`;
    btn.onclick = () => selectFont(i);
    container.appendChild(btn);
  });
}

function selectFont(idx) {
  if (selectedFonts.includes(idx)) {
    if (selectedFonts.length > 1) selectedFonts = selectedFonts.filter(i => i !== idx);
  } else {
    selectedFonts.push(idx);
  }
  buildFontSelector();
  saveSettings();
}

function applyRandomFont() {
  const idx = selectedFonts[Math.floor(Math.random() * selectedFonts.length)];
  document.documentElement.style.setProperty('--kana-font', FONTS[idx].stack);
}

// ---- SUPPRESS COMBO (tap-to-remove) ----
function suppressCombo(combo) {
  combo.forEach(c => {
    const hi = HIRAGANA.findIndex(x => x.k === c.k);
    if (hi !== -1) { enabledH[hi] = false; return; }
    const ki = KATAKANA.findIndex(x => x.k === c.k);
    if (ki !== -1) enabledK[ki] = false;
  });
  buildCharGrid();
  onCharSettingsChange();
  saveSettings();
}

// ---- READER STRIP ----
function renderReaderStrip() {
  if (appMode !== 'translate') return;
  const strip = document.getElementById('reader-strip');
  strip.innerHTML = '';

  const getText = combo => kanaToRoma
    ? combo.map(c => c.k).join('')
    : combo.map(c => c.r).join(' ');

  function addSlot(combo, typeClass, resultClass, tappable) {
    const el = document.createElement('div');
    const classes = ['reader-slot', typeClass, resultClass || '', tappable && combo ? 'slot-clickable' : ''].filter(Boolean);
    el.className = classes.join(' ');
    const ch = document.createElement('span');
    ch.className = 'slot-char';
    ch.textContent = combo ? getText(combo) : '·';
    el.appendChild(ch);
    if (tappable && combo) {
      el.addEventListener('click', () => {
        el.classList.remove('slot-clickable');
        el.classList.add('slot-suppressed');
        suppressCombo(combo);
      });
    }
    strip.appendChild(el);
  }

  const h1 = historyQueue[1], h0 = historyQueue[0];
  addSlot(h1?.combo ?? null, h1 ? 'slot-far' : 'slot-empty', h1 ? (h1.correct ? 'result-correct' : 'result-wrong') : '', true);
  addSlot(h0?.combo ?? null, h0 ? 'slot-adj' : 'slot-empty', h0 ? (h0.correct ? 'result-correct' : 'result-wrong') : '', true);
  addSlot(currentCombo.length ? currentCombo : null, currentCombo.length ? 'slot-current' : 'slot-empty', '', true);
  addSlot(upcomingQueue[0] ?? null, upcomingQueue[0] ? 'slot-adj' : 'slot-empty');
  addSlot(upcomingQueue[1] ?? null, upcomingQueue[1] ? 'slot-far' : 'slot-empty');
}

// ---- FLASHCARD ----
function updateFlashcard() {
  fcRevealed = false;
  document.getElementById('reveal-answer').style.display = 'none';
  document.getElementById('reveal-btn').style.display = 'inline-block';
  if (!currentCombo.length) { document.getElementById('fc-romaji-display').textContent = '?'; return; }
  document.getElementById('fc-romaji-display').textContent = currentCombo.map(c => c.r).join(' ');
  document.getElementById('fc-kana-display').textContent   = currentCombo.map(c => c.k).join('');
}

function revealAnswer() {
  fcRevealed = true;
  document.getElementById('reveal-btn').style.display    = 'none';
  document.getElementById('reveal-answer').style.display = 'block';
}

function markCard(correct) {
  if (!fcRevealed || !currentCombo.length) return;
  recordResult(currentCombo, correct);
  trackResult(correct);
  updateCharHistory(currentCombo, correct);
  nextChar();
}

function updateCharHistory(combo, correct) {
  const kana = combo.map(c => c.k).join('');
  const roma = combo.map(c => c.r).join(' ');
  if (!charHistory[kana]) {
    charHistory[kana] = { wrongCount: 0, rightCount: 0, lastSeenTurn: turnCounter, kana, roma };
  }
  const h = charHistory[kana];
  h.lastSeenTurn = turnCounter;
  if (correct) h.rightCount++;
  else h.wrongCount++;
  renderHistoryGrid();
}

function renderHistoryGrid() {
  const grid = document.getElementById('history-grid');
  if (!grid) return;

  const entries = Object.values(charHistory)
    .filter(h => showCorrect || h.wrongCount > 0)
    .sort((a, b) => b.lastSeenTurn - a.lastSeenTurn);

  grid.innerHTML = '';

  if (entries.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'history-empty';
    empty.textContent = showCorrect ? 'no history yet' : 'no mistakes yet — keep going!';
    grid.appendChild(empty);
    return;
  }

  entries.forEach((h, i) => {
    const card = document.createElement('div');
    const classes = ['hist-card'];
    if (i === 0) classes.push('is-newest');
    if (h.wrongCount > 0) classes.push('has-wrong');
    card.className = classes.join(' ');
    const kanaSize = h.kana.length > 2 ? '1.1rem' : '1.8rem';
    card.innerHTML = `
      <span class="hist-kana" style="font-size:${kanaSize}">${h.kana}</span>
      <span class="hist-roma">${h.roma}</span>
      ${h.wrongCount > 0 ? `<span class="hist-wrong-badge">${h.wrongCount}</span>` : ''}
    `;
    grid.appendChild(card);
  });
}

// ---- SUBMIT ----
function submitAnswer() {
  // Instant mode owns its own advance logic; Enter key is ignored there.
  if (appMode !== 'translate') return;
  if (document.getElementById('instant-toggle').checked) return;
  if (!currentCombo.length) return;
  const raw = document.getElementById('sticky-input').value.trim().toLowerCase();
  if (!raw) return;

  const acceptable = acceptableFor(currentCombo);
  const isCorrect  = acceptable.includes(raw);
  recordResult(currentCombo, isCorrect);

  if (!isCorrect) {
    const promptStr = kanaToRoma
      ? currentCombo.map(c => c.k).join('')
      : currentCombo.map(c => c.r).join(' ');
    addToWrong(promptStr, raw, acceptable[0]);
  }

  concludeRound(isCorrect ? 'right' : 'wrong');
}

// ---- INSTANT MODE ----
document.getElementById('sticky-input').addEventListener('input', () => {
  if (!document.getElementById('instant-toggle').checked) return;
  if (!currentCombo.length || !kanaToRoma) return;

  const raw        = document.getElementById('sticky-input').value.toLowerCase();
  const acceptable = acceptableFor(currentCombo);

  if (raw.length > 0 && !acceptable.some(a => a.startsWith(raw))) instantDirty = true;

  if (!acceptable.includes(raw)) return;

  if (!instantDirty && !instantWrong) {
    // No visible errors typed — but did the user delete something (backspace)?
    if (instantSilentDirty) {
      // Backspace was pressed during this round; count it as a miss
      recordResult(currentCombo, false);
      concludeRound('wrong');
    } else {
      // Genuinely clean first-try correct
      recordResult(currentCombo, true);
      concludeRound('right');
    }
  } else if (!instantWrong) {
    // First visible error — record miss, flash, clear input, wait for re-entry
    recordResult(currentCombo, false);
    instantWrong = true;
    instantDirty = false;
    const cur = document.querySelector('#reader-strip .slot-current');
    if (cur) {
      cur.classList.add('wrong-flash');
      setTimeout(() => cur.classList.remove('wrong-flash'), 500);
    }
    document.getElementById('sticky-input').value = '';
  } else {
    // Already had a visible error; now got it right — still 'wrong'
    concludeRound('wrong');
  }
});

// ---- WRONG SET ----
function addToWrong(prompt, typed, correct) {
  wrongSet[prompt] = { prompt, typed, correct };
  renderWrongSection();
}

function clearMissed() {
  wrongSet = {};
  renderWrongSection();
}

function renderWrongSection() {
  const section = document.getElementById('wrong-section');
  const list    = document.getElementById('wrong-list');
  const badge   = document.getElementById('wrong-count-badge');
  const entries = Object.values(wrongSet);

  badge.textContent = entries.length;
  if (entries.length === 0) { section.style.display = 'none'; return; }

  section.style.display = 'block';
  list.innerHTML = '';
  entries.forEach(({ prompt, typed, correct }) => {
    const c = document.createElement('div');
    c.className = 'card compact';
    const isKana = kanaToRoma;
    const fontSize = isKana
      ? (prompt.length > 3 ? '1.2rem' : '1.8rem')
      : (prompt.length > 10 ? '0.65rem' : '0.85rem');
    const spanClass = isKana ? 'card-char' : 'card-roma';
    c.innerHTML = `
      <span class="${spanClass}" style="font-size:${fontSize};flex-shrink:0">${prompt}</span>
      <span class="compact-detail">you: <b>${typed}</b><br>correct: <b>${correct}</b></span>
    `;
    list.appendChild(c);
  });
}

// ---- RESET ----
function resetSession() {
  wrongSet = {};
  currentCombo = [];
  lastComboKeys = [];
  turnCounter = 0;
  upcomingQueue = [];
  historyQueue  = [];
  instantDirty       = false;
  instantWrong       = false;
  instantSilentDirty = false;
  charStartTime      = null;
  globalTimings.length = 0;
  recentResults.length = 0;
  updateAccuracy();
  Object.keys(stats).forEach(k => delete stats[k]);
  Object.keys(charHistory).forEach(k => delete charHistory[k]);
  enabledH = HIRAGANA.map(() => true);
  enabledK = KATAKANA.map(() => true);
  buildCharGrid();
  renderHistoryGrid();
  renderWrongSection();
  saveSettings();
  nextChar();
}

// ---- KEYBOARD ----
document.getElementById('sticky-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') submitAnswer();
  // In instant mode, any deletion is treated as a silent error — the round will still
  // auto-advance when the correct answer is typed, but the card will show 'wrong'.
  if ((e.key === 'Backspace' || e.key === 'Delete') &&
      document.getElementById('instant-toggle').checked &&
      document.getElementById('sticky-input').value.length > 0) {
    instantSilentDirty = true;
  }
});

// ---- GO ----
init();
</script>
